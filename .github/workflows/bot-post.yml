name: 代理の書き込み

# Claude（作業用アカウント）が Issue に書くとき、名前を出さずに github-actions[bot] として書く。
# REST で dispatch する: POST /repos/hknroms/gradius3/actions/workflows/bot-post.yml/dispatches
#   { "ref": "main", "inputs": { "mode": "comment", "issue": "12", "body": "..." } }
# mode: comment（コメント）/ create（Issue を作る。title・labels を使う）/ edit（本文を置き換える。title があれば題名も）/ edit-comment（issue にコメントの ID を入れ、そのコメントを置き換える。コマンドは実行しない）
# コメントに共同作業ボットのコマンド（/claim /items /fixed など）があれば、その場で実行する（担当者名は「ai」、管理者として扱う）

on:
  workflow_dispatch:
    inputs:
      mode:  { description: 'comment / create / edit', required: true, default: comment }
      issue: { description: 'Issue 番号（comment・edit）', required: false, default: '' }
      title: { description: 'タイトル（create）', required: false, default: '' }
      labels: { description: 'ラベル（create、カンマ区切り）', required: false, default: '' }
      body:  { description: '本文', required: true }

permissions:
  issues: write
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}
          TITLE: ${{ inputs.title }}
          LABELS: ${{ inputs.labels }}
          BODY: ${{ inputs.body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const e = process.env;
            if (e.MODE === 'comment') {
              const r = await github.rest.issues.createComment({ owner, repo, issue_number: +e.ISSUE, body: e.BODY });
              core.info(r.data.html_url);
              // コマンドがあれば共同作業ボットをその場で動かす（GITHUB_TOKEN の書き込みでは別のワークフローが起動しないため）
              if (/^\s*\/(claim|check|submit|done|human|release|items|type|accept|reject|fixed|wontfix|later|now)\b/im.test(e.BODY)) {
                const issue = (await github.rest.issues.get({ owner, repo, issue_number: +e.ISSUE })).data;
                const comment = { ...r.data, user: { login: 'ai', type: 'User' }, author_association: 'COLLABORATOR', synthetic: true };
                const bot = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/task-bot.js');
                await bot({ github, context: { ...context, eventName: 'issue_comment', repo: { owner, repo }, payload: { issue, comment } }, core });
              }
            } else if (e.MODE === 'create') {
              const labels = e.LABELS ? e.LABELS.split(',').map(s => s.trim()).filter(Boolean) : [];
              const r = await github.rest.issues.create({ owner, repo, title: e.TITLE, body: e.BODY, labels });
              core.info(r.data.html_url);
            } else if (e.MODE === 'edit-comment') {
              await github.rest.issues.updateComment({ owner, repo, comment_id: +e.ISSUE, body: e.BODY });
            } else if (e.MODE === 'edit') {
              await github.rest.issues.update({ owner, repo, issue_number: +e.ISSUE, body: e.BODY, ...(e.TITLE ? { title: e.TITLE } : {}) });
            } else core.setFailed('mode が違います: ' + e.MODE);
