name: ご意見・ご要望・不具合報告
description: ご意見・ご要望・不具合・テストプレイの報告など
title: "[テスト] "
body:
  - type: markdown
    attributes:
      value: |
        ご意見・ご要望・不具合の報告、テストプレイの報告など、どんなことでも受け付けています。わかる範囲で書いてください（全部埋めなくても大丈夫です）。
        GitHub のボタンや一部の文字は英語ですが、入力する欄はすべて日本語です。
        - 一番上の **Title**（タイトル）：「[テスト] 」の後に、ひとことで内容を（例: 5面の中ボスでボスの曲にならない）
        - 下の各欄をわかる範囲で書いて、最後に一番下の緑のボタン（**Create** または **Submit new issue**）で送信
  - type: dropdown
    id: kind
    attributes:
      label: 報告の種類
      options:
        - 不具合
        - 気づいたこと・感想
        - 要望
        - いろいろまとめて（音声メモなど）
        - 直ったかの確認
    validations:
      required: true
  - type: dropdown
    id: version_pick
    attributes:
      label: 版
      description: 遊んだ版。ふつうは「最新版」のままで大丈夫です
      options:
        - 最新版
        - 1つ前の版
        - それ以外・わからない（下の欄に書く）
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版（「それ以外」のとき・わかれば）
      placeholder: v0.4.15
  - type: input
    id: build
    attributes:
      label: 起動画面の数字（版・ビルド日時）
      description: 電源を入れた直後の「RAM ROM CHECK」の下に出る数字（わかれば）。例の形は「版  年 月 日 時:分」
      placeholder: 0 4 17  26 10 23 11:13
  - type: input
    id: origin
    attributes:
      label: 確認した元の報告
      description: 配布ページの「確かめてほしいこと」から開くと入力済みになります（直ったかの確認のときだけ）
      placeholder: "#12"
  - type: input
    id: recheck
    attributes:
      label: 確認の結果
      description: 「直っていた」か「まだおかしい」（配布ページのボタンから開くと入力済み）
      placeholder: 直っていた
  - type: dropdown
    id: env
    attributes:
      label: 遊んだ環境
      options:
        - MAME（パソコン）
        - MAME4droid（Android）
        - その他のエミュレーター
        - 実機（基板）
    validations:
      required: true
  - type: input
    id: envdetail
    attributes:
      label: 環境の詳しいこと（わかれば）
      placeholder: 例）MAME 0.289 / Windows 11 / PS5 コントローラー
  - type: dropdown
    id: mode
    attributes:
      label: モード
      options:
        - NORMAL（メニューから開始）
        - CUBE RUSH（キューブラッシュ）
        - BOSS RUSH（ボスラッシュ）
        - 純正どおりの開始（メニューを使わない）
        - メニュー・ポーズ画面そのもの
        - その他・わからない
  - type: input
    id: stage
    attributes:
      label: 面・エリア
      placeholder: 例）5面 ❷ ／ 9面 キューブの途中
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
      description: 起きたこと、本来はどうなってほしいか。「いろいろまとめて」のときは、プレイ中のメモを丸ごと貼ってください（ほかの欄は空でも大丈夫です）。ほかの方の改造や解析の情報は見ないことにしているので、リンクは付けずに起きたことだけを書いてください
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 起こし方（再現手順）
      description: どうすると起きるか。毎回起きるか、たまにか
      placeholder: |
        1. メニューで MODE を CUBE RUSH にして開始
        2. ポーズで CUBE LINE H を LINE に
        3. …
  - type: textarea
    id: media
    attributes:
      label: スクリーンショット・動画
      description: ここに画像や動画のファイルをドラッグ（スマホは下の「Paste, drop, or click to add files」から選択）。動画は 10MB まで。大きいときは YouTube などのリンクで
