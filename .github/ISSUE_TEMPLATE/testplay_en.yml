name: Feedback, requests and bug reports (English)
description: Report a bug, a finding or a request
title: "[Test] "
body:
  - type: markdown
    attributes:
      value: |
        Feedback, requests, bug reports and test play reports are all welcome. Fill in what you can (you do not have to fill in everything).
        - **Title**: after "[Test] ", describe the issue in a few words (e.g. Boss music does not play at stage 5 mid-boss)
        - Fill in the fields below, then press the green button at the bottom (**Create** or **Submit new issue**)
  - type: dropdown
    id: kind
    attributes:
      label: Type of report
      options:
        - Bug
        - Finding / impression
        - Request
        - Several things at once (voice notes, etc.)
        - Re-check of a fix
    validations:
      required: true
  - type: dropdown
    id: version_pick
    attributes:
      label: Version
      description: The version you played. Usually leave it as "Latest"
      options:
        - Latest
        - Previous
        - Other / not sure (write below)
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (if "Other", if you know)
      placeholder: v0.4.15
  - type: input
    id: build
    attributes:
      label: Boot screen numbers (version and build time)
      description: "The numbers shown under RAM ROM CHECK right after power-on (if you know them) — version, then year month day hour:minute"
      placeholder: 0 4 17  26 10 23 11:13
  - type: input
    id: origin
    attributes:
      label: Original report checked
      description: Only when checking whether a fix works (filled in from the patch page)
      placeholder: "#12"
  - type: input
    id: recheck
    attributes:
      label: Re-check result
      description: "\"fixed\" or \"still broken\""
      placeholder: fixed
  - type: dropdown
    id: env
    attributes:
      label: Where you played
      options:
        - MAME (PC)
        - MAME4droid (Android)
        - Other emulator
        - Real hardware (PCB)
    validations:
      required: true
  - type: input
    id: envdetail
    attributes:
      label: Environment details (if known)
      placeholder: e.g. MAME 0.289 / Windows 11 / PS5 controller
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - NORMAL (started from the menu)
        - CUBE RUSH
        - BOSS RUSH
        - Original start (without the menu)
        - The menu or pause screen itself
        - Other / not sure
  - type: input
    id: stage
    attributes:
      label: Stage / area
      placeholder: e.g. Stage 5 ❷ / Stage 9 in the middle of the cubes
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What happened, and what you expected instead. For "Several things at once", paste all your play notes here (other fields can be left blank). We do not look at other people's mods or analysis, so please do not include such links; just describe what happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: What makes it happen. Does it happen every time or only sometimes?
      placeholder: |
        1. Set MODE to CUBE RUSH in the menu and start
        2. In the pause menu, set CUBE LINE H to LINE
        3. …
  - type: textarea
    id: media
    attributes:
      label: Screenshots / videos
      description: Drag image or video files here (on phones, choose them with "Paste, drop, or click to add files" below). Videos up to 10MB; for larger ones, please use a link such as YouTube
